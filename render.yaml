# Déploiement Render (render.com) : Blueprint « New → Blueprint » puis choisir ce dépôt
services:
  - type: web
    name: kfnpharma
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /sante
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: kfnpharma-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: SECURE_COOKIES
        value: "true"
      - key: TZ
        value: Africa/Abidjan
databases:
  - name: kfnpharma-db
    plan: free
    databaseName: kfnpharma
